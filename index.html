<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free flashcards with Flashcards, Learn, Test and Match modes.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Three by Five</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Shantell+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a study desk. Each set is a 3x5 index card lying on the desk; every study mode lifts one card to the center. */
:root {
  --desk: #e7ebf2;
  --paper: #ffffff;
  --panel: #f5f7fb;
  --ink: #1a2133;
  --ink-2: #535d75;
  --ink-3: #7b849b;
  --pen: #2944c2;
  --pen-strong: #1c3297;
  --pen-ink: #ffffff;
  --pen-wash: #e3e9fb;
  --pen-soft: #a3b3ec;
  --rule: #d5e0f2;
  --margin: #de6767;
  --hi: #ffd84a;
  --hi-edge: #b98a00;
  --hi-ink: #3d2f00;
  --hi-wash: #fff6c9;
  --good: #1a8452;
  --good-wash: #dcf2e5;
  --bad: #c1334a;
  --bad-ink: #ffffff;
  --bad-wash: #fbe3e7;
  --line: #d3d9e4;
  --scrim: rgba(17, 23, 37, .45);
  --shadow: 0 1px 2px rgba(26, 33, 51, .06), 0 6px 18px rgba(26, 33, 51, .08);
  --shadow-lift: 0 2px 4px rgba(26, 33, 51, .08), 0 16px 34px rgba(26, 33, 51, .13);

  --font-hand: "Shantell Sans", "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", system-ui, sans-serif;
  --font-ui: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --fs-xs: .75rem; --fs-sm: .875rem; --fs-base: 1rem; --fs-md: 1.125rem; --fs-lg: 1.375rem; --fs-xl: 1.875rem; --fs-2xl: 2.375rem;
  --r: 12px; --r-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0f131b; --paper: #1a2030; --panel: #151b27; --ink: #e7ebf4; --ink-2: #a6afc4; --ink-3: #7c869d;
    --pen: #8fa6ff; --pen-strong: #b2c2ff; --pen-ink: #0d1326; --pen-wash: #222c4b; --pen-soft: #4b5c9f;
    --rule: #262f45; --margin: #b85b5b; --hi: #f2cd3c; --hi-edge: #f2cd3c; --hi-ink: #2b2100; --hi-wash: #352f17;
    --good: #55c690; --good-wash: #15302a; --bad: #ff7589; --bad-ink: #1d0a10; --bad-wash: #3b1c25;
    --line: #2b3549; --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .32);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, .4), 0 16px 34px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0f131b; --paper: #1a2030; --panel: #151b27; --ink: #e7ebf4; --ink-2: #a6afc4; --ink-3: #7c869d;
  --pen: #8fa6ff; --pen-strong: #b2c2ff; --pen-ink: #0d1326; --pen-wash: #222c4b; --pen-soft: #4b5c9f;
  --rule: #262f45; --margin: #b85b5b; --hi: #f2cd3c; --hi-edge: #f2cd3c; --hi-ink: #2b2100; --hi-wash: #352f17;
  --good: #55c690; --good-wash: #15302a; --bad: #ff7589; --bad-ink: #1d0a10; --bad-wash: #3b1c25;
  --line: #2b3549; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .32);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, .4), 0 16px 34px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--desk); color: var(--ink); font-family: var(--font-ui); font-size: var(--fs-base); line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, figure { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.hand { font-family: var(--font-hand); }
.mono { font-family: var(--font-mono); font-size: var(--fs-sm); }
.muted { color: var(--ink-2); }
.small { font-size: var(--fs-sm); }
.icon { flex: none; display: block; }
.icon.filled { fill: currentColor; }
.is-star .icon, .icon.star-on { fill: var(--hi); stroke: var(--hi-edge); }
.h2 { font-family: var(--font-hand); font-weight: 600; font-size: var(--fs-lg); line-height: 1.2; }
.h3 { font-weight: 700; font-size: var(--fs-md); line-height: 1.3; }
.eyebrow { font-size: var(--fs-xs); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

/* shell + top bar */
.shell { width: 100%; max-width: 1040px; margin-inline: auto; padding-inline: 24px; }
main.shell { padding-block: 26px 80px; }
@media (max-width: 560px) { .shell { padding-inline: 16px; } main.shell { padding-block: 18px 72px; } }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--desk); border-bottom: 1px solid var(--line); }
.topbar-in { display: flex; align-items: center; gap: 10px; min-height: 60px; }
.brand { display: inline-flex; align-items: center; gap: 10px; padding: 6px 4px; margin-left: -4px; border: 0; background: none; border-radius: 8px; font-family: var(--font-hand); font-weight: 700; font-size: 1.25rem; letter-spacing: -.01em; color: var(--ink); }
.brand-mark { width: 34px; height: 26px; flex: none; }
.bm-back { fill: var(--pen-soft); }
.bm-front { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; }
.bm-red { stroke: var(--margin); stroke-width: 1.6; }
.bm-blue { stroke: var(--pen-soft); stroke-width: 1.1; }
.spacer { flex: 1; }
.sync { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.sync[data-state="saving"] .icon, .sync[data-state="loading"] .icon { animation: breathe 1.2s ease-in-out infinite; }
.sync[data-state="synced"] .icon { color: var(--good); }
.sync[data-state="error"] { color: var(--bad); border-color: var(--bad); }
@keyframes breathe { 50% { opacity: .35; } }
@media (max-width: 600px) { .sync-text { display: none; } .sync { width: 34px; padding: 0; justify-content: center; } }
@media (max-width: 400px) { .hide-xs { display: none; } .btn-new { width: 42px; padding: 0; } }

/* buttons + fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-weight: 700; font-size: .9375rem; line-height: 1.2; text-align: center; transition: background-color .15s, border-color .15s, color .15s, transform .1s; }
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); }
.btn-primary:hover { background: var(--pen-strong); border-color: var(--pen-strong); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--pen-wash); border-color: transparent; color: var(--ink); }
.btn-danger { background: var(--bad); border-color: var(--bad); color: var(--bad-ink); }
.btn-danger:hover { border-color: var(--bad); filter: brightness(1.05); }
.danger-text { color: var(--bad); }
.danger-text:hover { background: var(--bad-wash); color: var(--bad); }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: var(--fs-sm); }
.btn-icon { width: 40px; padding: 0; }
.link-btn { border: 0; background: none; color: var(--pen); font-weight: 700; padding: 6px 8px; border-radius: 6px; text-decoration: underline; text-underline-offset: 3px; }
.field { display: block; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--paper); color: var(--ink); line-height: 1.4; transition: border-color .15s, box-shadow .15s; }
.field:focus { outline: none; border-color: var(--pen); box-shadow: 0 0 0 3px var(--pen-wash); }
.field::placeholder { color: var(--ink-3); }
textarea.field { resize: vertical; min-height: 44px; }
.field-sm { width: 90px; padding: 6px 10px; }
.label { display: block; font-size: var(--fs-sm); font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }
.field-err, .form-err { color: var(--bad); font-size: var(--fs-sm); font-weight: 700; }
.form-err:empty { display: none; }

/* segmented control, switches, checks */
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 6px 12px; min-height: 32px; border-radius: 7px; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-2); }
.seg button:hover:not(:disabled) { color: var(--ink); }
.seg button[aria-pressed="true"], .seg button[aria-current="page"] { background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 0; cursor: pointer; }
.switch.is-disabled { opacity: .55; cursor: not-allowed; }
.sw-text { display: grid; }
.sw-text small { color: var(--ink-3); font-size: var(--fs-sm); }
.switch input { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 42px; height: 24px; margin: 0; border-radius: 999px; background: var(--line); cursor: inherit; transition: background-color .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--paper); box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .15s; }
.switch input:checked { background: var(--pen); }
.switch input:checked::after { transform: translateX(18px); }
.check { display: inline-flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; font-weight: 500; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--pen); }
.checks { display: flex; flex-wrap: wrap; gap: 4px 18px; }

/* meters + chips */
.meter { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--line); }
.meter span { display: block; height: 100%; transition: width .4s ease; }
.m-mastered { background: var(--pen); }
.m-learning { background: var(--pen-soft); }
.m-hi { background: var(--hi); }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--hi); color: var(--hi-ink); font-size: var(--fs-xs); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; flex: none; }
.pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: var(--fs-xs); font-weight: 700; flex: none; }
.pill-good { background: var(--good-wash); color: var(--good); }
.pill-learn { background: var(--pen-wash); color: var(--pen); }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; padding: 14px 16px; margin-bottom: 22px; border-radius: var(--r); background: var(--hi-wash); border: 1px solid var(--hi-edge); }
.banner p { flex: 1 1 280px; }
.banner-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.mi { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--pen-wash); color: var(--pen); flex: none; }

/* index card paper */
.ruled { background-image: repeating-linear-gradient(to bottom, transparent 0 25px, var(--rule) 25px 26px); }

/* home */
.home-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
.page-title { font-family: var(--font-hand); font-weight: 700; font-size: var(--fs-xl); line-height: 1.15; text-wrap: balance; }
.page-title .count { margin-left: 10px; font-family: var(--font-mono); font-size: var(--fs-md); font-weight: 500; color: var(--ink-3); }
.home-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.search { position: relative; }
.search .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search .field { width: 230px; height: 40px; padding-left: 36px; }
@media (max-width: 560px) { .home-tools, .search, .search .field { width: 100%; } }
.set-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 22px; }
.tile { position: relative; display: flex; flex-direction: column; min-height: 184px; padding: 0; text-align: left; border: 0; border-radius: 6px; background: var(--paper); color: var(--ink); box-shadow: var(--shadow); overflow: hidden; transition: transform .18s ease, box-shadow .18s ease; }
.tile:hover { transform: translateY(-3px) rotate(-.5deg); box-shadow: var(--shadow-lift); }
.tile-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 14px 16px 8px; border-bottom: 2px solid var(--margin); }
.tile-title { font-family: var(--font-hand); font-weight: 600; font-size: 1.15rem; line-height: 1.25; overflow-wrap: anywhere; text-wrap: balance; }
.tile-body { flex: 1; padding: 4px 16px 0; line-height: 26px; }
.tile-count { font-weight: 700; }
.tile-meta { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: var(--fs-sm); }
.tile-foot { display: flex; align-items: center; gap: 10px; padding: 10px 16px 14px; background: var(--paper); }
.tile-foot .meter { flex: 1; height: 6px; }
.tile-pct { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-3); white-space: nowrap; }
.tile-new { align-items: center; justify-content: center; gap: 8px; border: 2px dashed var(--line); background: transparent; box-shadow: none; color: var(--ink-2); font-weight: 700; }
.tile-new:hover { transform: none; box-shadow: none; border-color: var(--pen); color: var(--pen); }
.tile.skel { pointer-events: none; }
.skel .bar { display: block; height: 12px; border-radius: 6px; background: var(--line); animation: breathe 1.4s ease-in-out infinite; }
.loading-note { margin-top: 14px; }
.no-match { padding: 24px 0; }
.home-foot { margin-top: 28px; text-align: center; }
.empty { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 36px; align-items: center; padding: 32px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
.empty h2 { font-family: var(--font-hand); font-weight: 700; font-size: var(--fs-xl); line-height: 1.15; margin-bottom: 10px; text-wrap: balance; }
.empty p { color: var(--ink-2); max-width: 48ch; }
.empty-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 24px; }
.mode-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.mode-list li { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: var(--fs-sm); }
.mode-list b { color: var(--ink); }
.mode-list .mi { width: 30px; height: 30px; border-radius: 8px; }
.empty-example { display: grid; gap: 12px; justify-items: center; text-align: center; }
.empty-example .tile { width: min(300px, 100%); transform: rotate(2deg); }
.empty-example .tile:hover { transform: rotate(0deg) translateY(-3px); }
@media (max-width: 760px) { .empty { grid-template-columns: minmax(0, 1fr); gap: 28px; padding: 22px; } }
</style>
<style>
/* set page */
.crumb { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 6px 8px 6px 2px; margin-bottom: 10px; border: 0; background: none; border-radius: 6px; color: var(--ink-2); font-weight: 700; font-size: var(--fs-sm); text-align: left; }
.crumb:hover { color: var(--pen); }
.crumb span { overflow-wrap: anywhere; }
.set-title { font-family: var(--font-hand); font-weight: 700; font-size: var(--fs-2xl); line-height: 1.1; text-wrap: balance; overflow-wrap: anywhere; }
.set-desc { color: var(--ink-2); max-width: 65ch; margin-top: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.set-meta { color: var(--ink-3); font-size: var(--fs-sm); margin-top: 8px; }
.modes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 24px 0; }
@media (max-width: 800px) { .modes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mode { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 12px; row-gap: 2px; align-items: center; padding: 14px; text-align: left; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); color: var(--ink); transition: border-color .15s, transform .15s, box-shadow .15s; }
.mode .mi { grid-row: span 2; }
.mode b { font-size: var(--fs-md); line-height: 1.2; }
.mode small { color: var(--ink-2); font-size: var(--fs-sm); line-height: 1.3; }
.mode:hover { border-color: var(--pen); transform: translateY(-2px); box-shadow: var(--shadow); }
@media (max-width: 420px) { .mode { grid-template-columns: minmax(0, 1fr); row-gap: 8px; } .mode .mi { grid-row: auto; } .mode small { display: none; } }
.progress-panel { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px 28px; align-items: center; padding: 18px 20px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); }
@media (max-width: 640px) { .progress-panel { grid-template-columns: minmax(0, 1fr); } }
.pp-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.pp-pct { font-weight: 700; font-size: var(--fs-sm); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: var(--fs-sm); color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 3px; vertical-align: -1px; }
.lg-mastered { background: var(--pen); } .lg-learning { background: var(--pen-soft); } .lg-new { background: var(--line); }
.stats { display: flex; gap: 28px; }
.stat b { display: block; font-family: var(--font-mono); font-size: var(--fs-lg); font-weight: 700; font-variant-numeric: tabular-nums; }
.stat b.none { font-family: var(--font-ui); font-size: var(--fs-base); color: var(--ink-3); padding-block: 4px; }
.stat span { font-size: var(--fs-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 22px; }
.terms-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 28px 0 12px; }
.terms { list-style: none; margin: 0; padding: 0; border-radius: var(--r); background: var(--paper); box-shadow: var(--shadow); overflow: hidden; }
.term-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto; gap: 16px; align-items: start; padding: 12px 12px 12px 18px; border-bottom: 1px solid var(--rule); }
.term-row:last-child { border-bottom: 0; }
.term-row .t { font-family: var(--font-hand); font-weight: 600; font-size: var(--fs-md); line-height: 1.35; padding-top: 4px; overflow-wrap: anywhere; white-space: pre-wrap; }
.term-row .d { padding-top: 5px; overflow-wrap: anywhere; white-space: pre-wrap; }
@media (max-width: 600px) { .term-row { grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; } .term-row .d { grid-column: 1; grid-row: 2; padding-top: 0; color: var(--ink-2); } .term-row .star-btn { grid-column: 2; grid-row: 1 / span 2; } }
.star-btn { width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--ink-3); flex: none; }
.star-btn:hover { background: var(--pen-wash); color: var(--ink); }
.star-btn[aria-pressed="true"] .icon { fill: var(--hi); stroke: var(--hi-edge); }
.tool-panel { display: grid; gap: 14px; padding: 18px; margin-bottom: 18px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); }
.panel-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.panel-actions:not(:has(> :not([hidden]))) { display: none; }
.drop { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 18px; border: 2px dashed var(--line); border-radius: var(--r-sm); background: var(--paper); }
.tool-panel { transition: border-color .15s, background-color .15s; }
.tool-panel.dragging { border-color: var(--pen); background: var(--pen-wash); }
.tool-panel.dragging .drop { border-color: var(--pen); }
.panel-status { font-size: var(--fs-sm); color: var(--ink-2); }
.panel-status:empty { display: none; }
.panel-status.err { color: var(--bad); font-weight: 700; }

/* editor */
.editor { display: grid; gap: 18px; }

  if (inflight.has(id)) { again.add(id); return; }
  inflight.add(id);
  updateSync();
  const s = Store.sets.get(id);
  let failed = null;
  try {
    if (s) {
      const json = JSON.stringify(s);
      if (json.length > MAX_DOC_CHARS) throw { code: 'too_big' };
      await Store.col.doc(id).set(JSON.parse(json));
    } else {
      await Store.col.doc(id).delete();
    }
    retried.delete(id);
  } catch (e) {
    failed = e || {};
  }
  inflight.delete(id);
  if (Store.mode !== 'cloud') return;
  if (failed) { handleWriteError(failed, id); updateSync(); return; }
  if (again.has(id)) { again.delete(id); flush(id); return; }
  if (!timers.has(id)) dirty.delete(id);
  if (!dirty.size) syncError = false;
  updateSync();
}

  if (code === 'too_big') { dirty.delete(id); toast('This set is too big to save to your account. Split it into two sets.'); return; }
  if (code === 'quota_exceeded') { dirty.delete(id); toast("Your storage is full. Delete a set you don't need, then try again."); return; }
  if (code === 'unavailable' || code === 'resource_exhausted') {
    if (!retried.has(id)) { retried.add(id); schedule(id, 1500 + Math.random() * 1500); return; }
    retried.delete(id);
    syncError = true;
    toast("Couldn't save your last change. Tap “Not saved” at the top to try again.");
    return;
  }
  goLocal("Your sets can't be saved to your account here, so they are saved in this browser instead.");
}

}

function backupSets() {
  const sets = allSets();
  const data = { app: 'three-by-five', version: 1, saved: new Date().toISOString(), sets };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  const a = h('a', { href: url, download: `three-by-five-backup-${new Date().toISOString().slice(0, 10)}.json` });
  document.body.append(a);

function restoreSets(file) {
  const bad = () => toast("That file isn't a Three by Five backup.");
  const reader = new FileReader();
  reader.onerror = bad;
  reader.onload = () => {
    let data;
    try { data = JSON.parse(String(reader.result)); } catch (e) { bad(); return; }
    const list = Array.isArray(data) ? data : (data && Array.isArray(data.sets) ? data.sets : null);
    if (!list) { bad(); return; }
    let loaded = 0, kept = 0;
    for (const raw of list) {
      if (!raw || typeof raw.id !== 'string' || raw.id === EXAMPLE_ID || !Array.isArray(raw.cards)) continue;
      const s = cleanSet(raw.id, raw);
      const here = Store.sets.get(s.id);
      if (here && (here.rev || 0) >= (s.rev || 0)) { kept++; continue; }
      Store.sets.set(s.id, s);
      persist(s.id, 0);
      loaded++;
    }
    if (!loaded && !kept) { bad(); return; }
    emit();
    toast(loaded ? `Loaded ${plural(loaded, 'set')}` : 'You already have the newest copy of those sets.');
  };
  reader.readAsText(file);
}

function findSep(line, st) {
  if (st.term === 'tab') { const i = line.indexOf('\t'); return i < 0 ? null : { i, len: 1 }; }
  if (st.term === 'colon') { const i = line.indexOf(':'); return i < 0 ? null : { i, len: 1 }; }
  if (st.term === 'comma') { const i = line.indexOf(','); return i < 0 ? null : { i, len: 1 }; }
  if (st.term === 'dash') { const m = /\s*(?:[–—]|-(?=\s))\s*/.exec(line); return m ? { i: m.index, len: m[0].length } : null; }
  if (st.term === 'custom') {
    if (!st.customTerm) return null;
    const i = line.indexOf(st.customTerm);
    return i < 0 ? null : { i, len: st.customTerm.length };
  }
  return null;
}
const HEADER_WORDS = new Set(['term', 'terms', 'word', 'words', 'vocabulary', 'vocab', 'definition', 'definitions', 'meaning', 'meanings', 'question', 'questions', 'answer', 'answers']);
function parseList(text, st) {
  let chunks;
  if (st.card === 'semi') chunks = text.split(';');
  else if (st.card === 'custom' && st.customCard) chunks = text.split(st.customCard);
  else chunks = text.split(/\r?\n/);
  const cards = [];
  let skipped = 0;
  for (const raw of chunks) {
    const line = raw.replace(/\r/g, ' ');
    if (!line.trim()) continue;
    const m = findSep(line, st);
    const t = m ? line.slice(0, m.i).trim() : '';
    const d = m ? line.slice(m.i + m.len).trim() : '';
    if (!t || !d) { skipped++; continue; }
    if (HEADER_WORDS.has(norm(t)) && HEADER_WORDS.has(norm(d))) continue;
    cards.push({ t: t.slice(0, 2000), d: d.slice(0, 4000) });
  }
  return { cards, skipped };
}
function detectSep(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return null;
  const share = (re) => lines.filter(l => re.test(l)).length / lines.length;
  if (share(/\t/) >= 0.5) return 'tab';
  if (share(/[–—]|\s-\s/) >= 0.5) return 'dash';
  if (share(/:/) >= 0.5) return 'colon';
  if (share(/,/) >= 0.5) return 'comma';
  return null;
}

async function streamCards(input, opts, onCards) {

}

const PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const PDF_MAX_PAGES = 80;
const PDF_MAX_BYTES = 40 * 1024 * 1024;

/* Rebuilds lines from the positioned text pieces on a page. A wide gap inside a line becomes a tab,
   so two-column vocabulary tables turn into "term<TAB>definition" rows. */
async function pdfPageText(page) {
  const tc = await page.getTextContent();
  const lines = [];
  let line = '', lastY = null, lastEnd = null, lastSize = 10;
  for (const it of tc.items) {
    if (typeof it.str !== 'string') continue;
    const tr = it.transform || [1, 0, 0, 10, 0, 0];
    const x = tr[4], y = tr[5];
    const size = it.height || Math.abs(tr[3]) || lastSize;
    if (it.str && !it.str.trim()) {
      // pdf.js reports the space between columns as one wide blank piece
      if (line) line += (it.width || 0) > lastSize * 1.5 ? '\t' : ' ';
      if (it.width) lastEnd = x + it.width;
    } else if (it.str) {
      if (lastY !== null && Math.abs(y - lastY) > size * 0.5) {
        if (line.trim()) lines.push(line);
        line = '';
        lastEnd = null;
      }
      if (line && lastEnd !== null) {
        const gap = x - lastEnd;
        if (gap > size * 1.5) line += '\t';
        else if (gap > size * 0.15 && !/\s$/.test(line) && !/^\s/.test(it.str)) line += ' ';
      }
      line += it.str;
      lastEnd = x + (it.width || 0);
      lastY = y;
      lastSize = size;
    }
    if (it.hasEOL) {
      if (line.trim()) lines.push(line);
      line = '';
      lastY = null;
      lastEnd = null;
    }
  }
  if (line.trim()) lines.push(line);
  return lines.map(l => l.replace(/[  ]+/g, ' ').replace(/ *\t[\t ]*/g, '\t').trim()).filter(Boolean).join('\n');
}
async function pdfPageImages(doc, n) {
  const blobs = [];
  for (let p = 1; p <= Math.min(n, doc.numPages); p++) {
    const page = await doc.getPage(p);
    const base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: Math.min(2, 1400 / Math.max(base.width, base.height)) });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(vp.width);
    canvas.height = Math.round(vp.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
    if (blob) blobs.push(blob);
    page.cleanup();
  }

}

    const { added, error } = await streamCards(images ? notesPrompt('', true) : notesPrompt(text), opts, (arr, total) => {
      onCards(arr);
      setStatus(`Added ${plural(total, 'card')} so far…`);
    });
    ctl = null;
    setBusy(false);
    setStatus(claudeResultText(added, error), !!error && error.code !== 'cancelled');
    if (error && SAMPLE_OFF.has(error.code)) claudeBtn.hidden = true;
  });
  pairsBtn.addEventListener('click', () => { if (text) toList(text); });
  stopBtn.addEventListener('click', () => { if (ctl) ctl.abort(); });
  fileIn.addEventListener('change', () => { const f = fileIn.files && fileIn.files[0]; fileIn.value = ''; read(f); });
  const panel = h('section', { class: 'tool-panel' },
    h('div', null, h('h3', { class: 'h3', text: 'Upload a PDF' }), desc),
    h('div', { class: 'drop' }, pick, h('span', { class: 'muted small', text: 'or drop a PDF here' }), fileIn),
    status,
    h('div', { class: 'panel-actions' }, claudeBtn, pairsBtn, stopBtn));
  panel.addEventListener('dragover', (e) => { e.preventDefault(); panel.classList.add('dragging'); });
  panel.addEventListener('dragleave', (e) => { if (!panel.contains(e.relatedTarget)) panel.classList.remove('dragging'); });
  panel.addEventListener('drop', (e) => {
    e.preventDefault();
    panel.classList.remove('dragging');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    read(f);
  });
  panel.focusInput = () => pick.focus();
  panel.refresh = refresh;
  refresh();
  return panel;
}

VIEWS.edit = function EditView() {
  const editing = view.setId ? getSet(view.setId) : null;
  if (view.setId && (!editing || view.setId === EXAMPLE_ID)) return missingSet();
  if (!view.draft) {
    view.draft = editing
      ? { title: editing.title, desc: editing.desc, cards: editing.cards.map(c => ({ id: c.id, t: c.t, d: c.d })) }
      : { title: '', desc: '', cards: [blankCard(), blankCard(), blankCard()] };
    if (!view.draft.cards.length) view.draft.cards.push(blankCard());
    view.original = draftKey(view.draft);
  }
  if (view.openImport) { view.panel = 'import'; view.openImport = false; view.focusPanel = true; }
  if (view.openPdf) { view.panel = 'pdf'; view.openPdf = false; view.focusPanel = true; }
  const d = view.draft;
  let importEl = null, notesEl = null, pdfEl = null;
  const goBack = () => (editing ? show('set', { setId: editing.id }) : show('home'));
  const leave = async () => {
    if (draftKey(d) !== view.original) {
      const ok = await confirmBox({ title: 'Discard your changes?', body: editing ? 'Your edits to this set will be lost.' : 'This new set will not be saved.', ok: 'Discard', cancel: 'Keep editing', danger: true });
      if (!ok) return;
    }
    goBack();
  };

  const titleErr = h('p', { class: 'field-err', hidden: true, text: 'Give your set a title.' });
  const titleIn = h('input', { class: 'field title-input', id: 'set-title', type: 'text', value: d.title, maxlength: 200, placeholder: 'Like “Biology chapter 3”', oninput: (e) => { d.title = e.target.value; titleErr.hidden = true; } });
  const descIn = h('textarea', { class: 'field', id: 'set-desc', rows: 2, value: d.desc, maxlength: 2000, placeholder: 'Optional', oninput: (e) => { d.desc = e.target.value; } });
  const toolsRow = h('div', { class: 'tools' });
  const panelSlot = h('div');
  const list = h('ol', { class: 'rows' });
  const countEl = h('span', { class: 'muted small' });
  const formErr = h('p', { class: 'form-err', role: 'alert' });

  function drawTools() {
    const toggle = (name) => { view.panel = view.panel === name ? null : name; view.focusPanel = !!view.panel; drawTools(); drawPanel(); };
    toolsRow.replaceChildren(...[
      h('button', { class: 'btn btn-sm', type: 'button', 'aria-expanded': String(view.panel === 'import'), onclick: () => toggle('import') }, icon('clipboard', 16), 'Paste a list'),
      h('button', { class: 'btn btn-sm', type: 'button', 'aria-expanded': String(view.panel === 'pdf'), onclick: () => toggle('pdf') }, icon('pdf', 16), 'Upload a PDF'),
      sampleFn ? h('button', { class: 'btn btn-sm', type: 'button', 'aria-expanded': String(view.panel === 'notes'), onclick: () => toggle('notes') }, icon('notes', 16), 'Make cards from notes') : null,
      h('button', { class: 'btn btn-sm btn-ghost', type: 'button', onclick: () => { for (const c of d.cards) { const t = c.t; c.t = c.d; c.d = t; } drawRows(); toast('Swapped terms and definitions'); } }, icon('swap', 16), 'Swap sides'),
    ].filter(Boolean));
  }
  function drawPanel() {
    let el = null;
    if (view.panel === 'import') el = importEl || (importEl = importPanel(appendCards));
    else if (view.panel === 'pdf') el = pdfEl || (pdfEl = pdfPanel(appendCards, pdfToList));
    else if (view.panel === 'notes' && sampleFn) el = notesEl || (notesEl = notesPanel(appendCards));
    if (el) panelSlot.replaceChildren(el); else panelSlot.replaceChildren();
    if (el && view.focusPanel) { view.focusPanel = false; setTimeout(() => el.focusInput && el.focusInput(), 30); }
  }
  function pdfToList(text) {
    view.panel = 'import';
    drawTools();
    drawPanel();
    if (importEl) importEl.setText(text);
    toast('The PDF text is in Paste a list. Check the pairs, then add them.');
  }
  function updateCount() {
    const n = d.cards.filter(c => c.t.trim() || c.d.trim()).length;
    countEl.textContent = plural(n, 'card');
  }
  function appendCards(arr) {
    while (d.cards.length && !d.cards[d.cards.length - 1].t.trim() && !d.cards[d.cards.length - 1].d.trim()) d.cards.pop();
    for (const c of arr) d.cards.push({ id: rid('c'), t: c.t, d: c.d });
    if (!d.cards.length) d.cards.push(blankCard());
    formErr.textContent = '';
    drawRows();
  }
  function addCard() {
    d.cards.push(blankCard());
    drawRows(d.cards.length - 1, 't');
    const last = list.lastElementChild;
    if (last) last.scrollIntoView({ block: 'nearest' });
  }
  function rowEl(c, i) {
    const tId = 'term-' + c.id, dId = 'def-' + c.id;
    const err = h('p', { class: 'row-err', hidden: true });
    const row = h('li', { class: 'row' });
    const clearErr = () => { row.classList.remove('has-err'); err.hidden = true; formErr.textContent = ''; };
    const tIn = h('textarea', {
      class: 'field in-t', id: tId, rows: 1, value: c.t, maxlength: 2000, placeholder: 'Enter a term',
      oninput: (e) => { c.t = e.target.value; grow(e.target); clearErr(); updateCount(); },
      onkeydown: (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); dIn.focus(); } },
    });
    const dIn = h('textarea', {
      class: 'field in-d', id: dId, rows: 1, value: c.d, maxlength: 4000, placeholder: 'Enter the definition',
      oninput: (e) => { c.d = e.target.value; grow(e.target); clearErr(); updateCount(); },
      onkeydown: (e) => {
        if (e.key === 'Tab' && !e.shiftKey && i === d.cards.length - 1 && (c.t.trim() || c.d.trim())) { e.preventDefault(); addCard(); }
      },
    });
    const del = h('button', {
      class: 'btn btn-ghost btn-icon row-del', type: 'button', 'aria-label': `Delete card ${i + 1}`, title: 'Delete card',
      onclick: () => {
        if (d.cards.length <= 1) { c.t = ''; c.d = ''; drawRows(0, 't'); return; }
        d.cards.splice(i, 1);
        drawRows(Math.min(i, d.cards.length - 1), 't');
      },
    }, icon('trash', 18));
    append(row, [
      h('span', { class: 'row-num', 'aria-hidden': 'true', text: String(i + 1) }),
      h('div', { class: 'row-f row-ft' }, tIn, h('label', { class: 'row-label', for: tId, text: 'Term' })),
      h('div', { class: 'row-f row-fd' }, dIn, h('label', { class: 'row-label', for: dId, text: 'Definition' })),
      del, err,
    ]);
    row.showErr = (msg, field) => { row.classList.add('has-err'); err.textContent = msg; err.hidden = false; return field === 'd' ? dIn : tIn; };
    return row;
  }
  function drawRows(focusIdx, field) {
    list.replaceChildren(...d.cards.map((c, i) => rowEl(c, i)));
    updateCount();
    requestAnimationFrame(() => list.querySelectorAll('textarea').forEach(grow));
    if (focusIdx != null) {
      const r = list.children[focusIdx];
      const f = r && r.querySelector(field === 'd' ? '.in-d' : '.in-t');
      if (f) f.focus();
    }
  }
  function save() {
    formErr.textContent = '';
    titleErr.hidden = true;
    const title = d.title.trim();
    let firstBad = null;
    if (!title) { titleErr.hidden = false; firstBad = titleIn; }
    const kept = [];
    d.cards.forEach((c, i) => {
      const t = c.t.trim(), dd = c.d.trim();
      if (!t && !dd) return;
      if (!t || !dd) {
        const f = list.children[i].showErr(t ? 'Add a definition, or delete this card.' : 'Add a term, or delete this card.', t ? 'd' : 't');
        firstBad = firstBad || f;
      }
      kept.push({ id: c.id, t, d: dd });
    });
    if (!firstBad && kept.length < 2) {
      formErr.textContent = kept.length ? 'Add at least one more card.' : 'Add at least 2 cards.';
      const emptyRow = d.cards.findIndex(c => !c.t.trim());
      if (emptyRow >= 0) firstBad = list.children[emptyRow].querySelector('.in-t');
      else { addCard(); return; }
    }
    if (firstBad) {
      if (!formErr.textContent) formErr.textContent = 'Fix the highlighted parts, then save.';
      firstBad.focus();
      firstBad.scrollIntoView({ block: 'center' });
      return;
    }
    const seen = new Set();
    for (const c of kept) { if (seen.has(c.id)) c.id = rid('c'); seen.add(c.id); }
    const desc = d.desc.trim().slice(0, 2000);
    if (editing) {
      changeSet(editing.id, (s) => {
        s.title = title.slice(0, 300);
        s.desc = desc;
        s.cards = kept;
        s.updated = Date.now();
        const ids = new Set(kept.map(c => c.id));
        s.stars = s.stars.filter(x => ids.has(x));
        for (const k of Object.keys(s.learn)) if (!ids.has(k)) delete s.learn[k];
      }, { delay: 0 });
      show('set', { setId: editing.id });
      toast('Saved');
    } else {
      const s = createSet({ title: title.slice(0, 300), desc, cards: kept });
      show('set', { setId: s.id });
      toast('Set created');
    }
  }

  const saveBtn = h('button', { class: 'btn btn-primary', type: 'button', onclick: save }, editing ? 'Save changes' : 'Create set');
  const root = h('div', { class: 'editor' },
    h('div', null,
      h('button', { class: 'crumb', type: 'button', onclick: leave }, icon('back', 18), h('span', { text: editing ? editing.title : 'Your sets' })),
      h('h1', { class: 'page-title', text: editing ? 'Edit set' : 'Create a set' })),
    h('section', { class: 'editor-top' },
      h('label', { class: 'label', for: 'set-title', text: 'Title' }), titleIn, titleErr,
      h('label', { class: 'label', for: 'set-desc', text: 'Description' }), descIn),
    toolsRow,
    panelSlot,
    h('div', { class: 'rows-head' }, h('h2', { class: 'h2', text: 'Cards' }), countEl),
    list,
    h('button', { class: 'add-card', type: 'button', onclick: addCard }, icon('plus', 18), 'Add card'),
    h('div', { class: 'savebar' }, formErr, h('div', { class: 'savebar-btns' },
      h('button', { class: 'btn btn-ghost', type: 'button', onclick: leave }, 'Cancel'), saveBtn)));
  drawTools();
  drawPanel();
  drawRows();
  view.onSample = () => { if (pdfEl) pdfEl.refresh(); drawTools(); drawPanel(); };
  if (!editing && !view.panel) setTimeout(() => { if (titleIn.isConnected) titleIn.focus(); }, 30);
  return root;
};

/* ================= flashcards ================= */
VIEWS.flashcards = function FlashcardsView() {
  const s0 = getSet(view.setId);
  if (!s0) return missingSet();
  const o = prefs.fc;
  const root = h('div', { class: 'study' });
  const optsBox = h('div', { class: 'opts', hidden: true });
  const stage = h('div');
  let S = null;
  let suppressClick = false;

  const cur = () => getSet(view.setId);
  const cardById = (id) => { const s = cur(); return s ? s.cards.find(c => c.id === id) : null; };

  function start(onlyIds) {
    const s = cur();
    if (!s) { show('home'); return; }
    let ids = s.cards.map(c => c.id);
    let note = '';
    if (o.starred) {
      const st = ids.filter(id => s.stars.includes(id));
      if (st.length) ids = st; else note = 'No starred terms yet, so you are seeing every card.';
    }
    if (onlyIds) ids = ids.filter(id => onlyIds.includes(id));
    if (o.shuffle) shuffle(ids);
    S = { ids, i: 0, flipped: false, known: new Set(), learning: new Set(), hist: [], done: false, note, dir: 'fade' };
    paint();
  }
  function markStudied() { changeSet(view.setId, (st) => { st.studied = Date.now(); }, { quiet: true, delay: 4000 }); }
  function flip() {
    if (!S || S.done) return;
    S.flipped = !S.flipped;
    const el = stage.querySelector('.flash');
    if (el) {
      el.classList.toggle('flipped', S.flipped);
      el.setAttribute('aria-label', faceLabel());
    }
  }
  function faceLabel() {
    const c = cardById(S.ids[S.i]);
    if (!c) return '';
    const termFirst = o.front === 'term';
    const showTerm = termFirst !== S.flipped;
    return `${showTerm ? 'Term' : 'Definition'}: ${showTerm ? c.t : c.d}. Press Space to flip.`;
  }
  function sort(known) {
    if (!S || S.done) return;
    const id = S.ids[S.i];
    S.hist.push({ i: S.i, id });
    (known ? S.known : S.learning).add(id);
    (known ? S.learning : S.known).delete(id);
    S.i++;
    S.flipped = false;
    S.dir = known ? 'right' : 'left';
    if (S.i >= S.ids.length) S.done = true;
    markStudied();
    paint();
  }
  function undo() {
    const last = S && S.hist.pop();
    if (!last) return;
    S.known.delete(last.id);
    S.learning.delete(last.id);
    S.i = last.i;
    S.done = false;
    S.flipped = false;
    S.dir = 'fade';
    paint();
  }
  function step(delta) {
    if (!S) return;
    const ni = S.i + delta;
    if (ni < 0) return;
    if (ni >= S.ids.length) { S.done = true; markStudied(); paint(); return; }
    S.i = ni;
    S.flipped = false;
    S.dir = delta > 0 ? 'next' : 'prev';
    paint();
  }

  function cardView(c) {
    const termFirst = o.front === 'term';
    const front = termFirst ? { label: 'Term', text: c.t } : { label: 'Definition', text: c.d };
    const back = termFirst ? { label: 'Definition', text: c.d } : { label: 'Term', text: c.t };
    const face = (side, cls) => h('div', { class: 'face ' + cls, 'aria-hidden': 'true' },
      h('div', { class: 'face-head' }, h('span', { class: 'eyebrow', text: side.label })),
      h('div', { class: 'face-body ruled' }, h('div', { class: 'face-text ' + sizeClass(side.text), text: side.text })));
    const card = h('div', { class: 'flash enter-' + S.dir + (S.flipped ? ' flipped' : ''), role: 'button', tabindex: '0', 'aria-label': faceLabel() },
      h('div', { class: 'flash-inner' }, face(front, 'front'), face(back, 'back')));
    const tools = h('div', { class: 'card-tools' });
    if (canSpeak) {
      tools.append(h('button', {
        class: 'star-btn', type: 'button', 'aria-label': 'Read aloud', title: 'Read aloud',
        onclick: (e) => { e.stopPropagation(); const termShown = (o.front === 'term') !== S.flipped; speak(termShown ? c.t : c.d); },
      }, icon('speak', 20)));
    }
    tools.append(starButton(cur(), c.id));
    const wrap = h('div', { class: 'flash-wrap' }, card, tools);

    let sx = 0, sy = 0, dragging = false, moved = false, pid = null;
    card.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      sx = e.clientX; sy = e.clientY; dragging = true; moved = false; pid = e.pointerId;
    });
    card.addEventListener('pointermove', (e) => {
      if (!dragging || e.pointerId !== pid) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (!moved && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
        moved = true;
        try { card.setPointerCapture(pid); } catch (err) { /* ignore */ }
        card.classList.add('dragging');
        wrap.classList.add('dragging');
      }
      if (moved) {
        card.style.transform = `translateX(${dx}px) rotate(${dx / 28}deg)`;
        card.dataset.swipe = o.track ? (dx > 70 ? 'right' : dx < -70 ? 'left' : '') : '';
      }
    });
    const endDrag = (e, cancel) => {
      if (!dragging) return;
      dragging = false;
      card.classList.remove('dragging');
      wrap.classList.remove('dragging');
      if (!moved) return;
      const dx = e.clientX - sx;
      card.style.transform = '';
      delete card.dataset.swipe;
      suppressClick = true;
      setTimeout(() => { suppressClick = false; }, 60);
      if (cancel || Math.abs(dx) < 80) return;
      if (o.track) sort(dx > 0); else step(dx < 0 ? 1 : -1);
    };
    card.addEventListener('pointerup', (e) => endDrag(e, false));
    card.addEventListener('pointercancel', (e) => endDrag(e, true));
    card.addEventListener('click', () => { if (!suppressClick) flip(); });
    return wrap;
  }

  function results() {
    const total = S.ids.length;
    if (o.track) {
      const k = S.known.size, l = S.learning.size;
      const p = { total, mastered: k, learning: 0, fresh: total - k };
      return h('div', { class: 'results enter-fade' },
        h('p', { class: 'eyebrow', text: 'Round complete' }),
        h('h2', { class: 'res-title', text: l ? `You know ${k} of ${total} cards` : `You know all ${plural(total, 'card')}` }),
        h('div', { class: 'res-meter' }, meter(p)),
        h('p', { class: 'muted', text: l ? `Keep going with the ${plural(l, 'card')} you are still learning.` : 'Nice work. Try Learn or a practice test next.' }),
        h('div', { class: 'res-actions' },
          l ? h('button', { class: 'btn btn-primary', type: 'button', onclick: () => start([...S.learning]) }, `Review ${plural(l, 'card')}`)
            : h('button', { class: 'btn btn-primary', type: 'button', onclick: () => show('learn', { setId: view.setId }) }, 'Go to Learn'),
          h('button', { class: 'btn', type: 'button', onclick: () => start() }, icon('reset', 16), 'Restart all cards')));
    }
    return h('div', { class: 'results enter-fade' },
      h('h2', { class: 'res-title', text: 'You reached the end of the deck' }),
      h('p', { class: 'muted', text: `That was all ${plural(total, 'card')}.` }),
      h('div', { class: 'res-actions' },
        h('button', { class: 'btn btn-primary', type: 'button', onclick: () => start() }, icon('reset', 16), 'Start over'),
        h('button', { class: 'btn', type: 'button', onclick: () => show('learn', { setId: view.setId }) }, 'Go to Learn')));
  }

  function paint() {
    const s = cur();
    if (!s) { show('home'); return; }
    const total = S.ids.length;
    const parts = [];
    if (S.note) parts.push(h('p', { class: 'note', text: S.note }));
    parts.push(h('div', { class: 'thin', 'aria-hidden': 'true' }, h('span', { style: `width:${total ? (Math.min(S.i, total) / total) * 100 : 0}%` })));
    if (!total) {
      parts.push(h('div', { class: 'results' }, h('p', { text: 'There are no cards to show.' })));
      stage.replaceChildren(...parts);
      return;
    }
    if (S.done) {
      parts.push(results());
      stage.replaceChildren(...parts);
      return;
    }
    const c = cardById(S.ids[S.i]);
    if (!c) { S.ids.splice(S.i, 1); if (S.i >= S.ids.length) S.done = true; paint(); return; }
    parts.push(cardView(c));
    const counter = h('span', { class: 'counter', 'aria-live': 'polite', text: `${S.i + 1} / ${total}` });
    if (o.track) {
      parts.push(h('div', { class: 'fc-controls' },
        h('button', { class: 'btn btn-learning', type: 'button', onclick: () => sort(false) }, h('span', { class: 'count', text: String(S.learning.size) }), 'Still learning'),
        counter,
        h('button', { class: 'btn btn-know', type: 'button', onclick: () => sort(true) }, 'Know it', h('span', { class: 'count', text: String(S.known.size) }))));
    } else {
      parts.push(h('div', { class: 'fc-controls' },
        h('button', { class: 'btn', type: 'button', disabled: S.i === 0, onclick: () => step(-1) }, icon('prev', 18), 'Back'),
        counter,
        h('button', { class: 'btn', type: 'button', onclick: () => step(1) }, 'Next', icon('next', 18))));
    }
    parts.push(h('div', { class: 'fc-tools' },
      o.track ? h('button', { class: 'btn btn-ghost btn-sm', type: 'button', disabled: !S.hist.length, onclick: undo }, icon('undo', 16), 'Undo') : null,
      h('button', { class: 'btn btn-ghost btn-sm', type: 'button', 'aria-pressed': String(o.shuffle), onclick: () => { o.shuffle = !o.shuffle; savePrefs(); start(); toast(o.shuffle ? 'Shuffled' : 'Back in order'); } }, icon('shuffle', 16), 'Shuffle'),
      h('button', { class: 'btn btn-ghost btn-sm', type: 'button', 'aria-expanded': String(!optsBox.hidden), onclick: toggleOpts }, icon('sliders', 16), 'Options')));
    parts.push(h('p', { class: 'kbd-hint' },
      h('kbd', { text: 'Space' }), ' flip  ·  ',
      o.track ? [h('kbd', { text: '←' }), ' still learning  ·  ', h('kbd', { text: '→' }), ' know it']
        : [h('kbd', { text: '←' }), ' ', h('kbd', { text: '→' }), ' move between cards']));
    stage.replaceChildren(...parts);
  }

  function drawOpts() {
    const s = cur();
    const n = s ? starCount(s) : 0;
    optsBox.replaceChildren(
      switchRow('fc-track', 'Track progress', 'Sort cards into “know it” and “still learning.”', o.track, (v) => { o.track = v; savePrefs(); start(); }),
      switchRow('fc-starred', 'Starred terms only', n ? `${plural(n, 'starred term')}` : 'Star terms first to use this.', o.starred && n > 0, (v) => { o.starred = v; savePrefs(); start(); }, !n),
      h('div', { class: 'opt-row' }, h('span', { class: 'opt-label', text: 'Show first' }),
        seg([{ v: 'term', label: 'Term' }, { v: 'def', label: 'Definition' }], o.front, (v) => { o.front = v; savePrefs(); S.flipped = false; S.dir = 'fade'; paint(); }, { label: 'Show first' })));
  }
  function toggleOpts() {
    optsBox.hidden = !optsBox.hidden;
    if (!optsBox.hidden) drawOpts();
    paint();
  }

  keyHandler = (e, typing) => {
    if (typing || !S) return;
    const t = e.target;

const ROUND_SIZE = 7;

function buildOptions(set, card, side) {
  const right = card[side];
  const seen = new Set([norm(right)]);
  const others = shuffle(set.cards.filter(x => x.id !== card.id)).map(x => x[side]).filter((v) => {
    const k = norm(v);
    if (!k || seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  return shuffle([right, ...others.slice(0, 3)]);
}

/* ================= test ================= */
const TYPE_NAMES = { tf: 'True or false', mc: 'Multiple choice', written: 'Written' };
function buildTest(set, n, types, dir) {
  const ids = shuffle(set.cards.map(c => c.id)).slice(0, n);
  const byId = new Map(set.cards.map(c => [c.id, c]));
  const counts = { tf: 0, mc: 0, written: 0 };
  ids.forEach((_, i) => { counts[types[i % types.length]]++; });
  const qs = [];
  let k = 0;
  for (const type of ['tf', 'mc', 'written']) {
    for (let j = 0; j < counts[type]; j++) {
      const c = byId.get(ids[k++]);
      const toTerm = dir === 'both' ? Math.random() < 0.5 : dir === 'term';
      const side = toTerm ? 't' : 'd';
      const q = {
        cid: c.id, type,
        prompt: toTerm ? c.d : c.t, answer: c[side],
        pLabel: toTerm ? 'Definition' : 'Term', aWord: toTerm ? 'term' : 'definition',
        response: null, correct: null, override: false,
      };
      if (type === 'mc') {
        q.options = buildOptions(set, c, side);
        if (q.options.length < 2) q.type = 'written';
      } else if (type === 'tf') {
        const others = set.cards.filter(x => x.id !== c.id && norm(x[side]) !== norm(q.answer));
        if (others.length && Math.random() < 0.5) { q.shown = others[Math.floor(Math.random() * others.length)][side]; q.truth = false; }
        else { q.shown = q.answer; q.truth = true; }
      }
      qs.push(q);
    }
  }
  return qs;
}

    }
    for (const q of T.qs) {
      if (q.type === 'tf') q.correct = q.response === q.truth;
      else if (q.type === 'mc') q.correct = q.response != null && q.options[q.response] === q.answer;
      else q.correct = answerMatches(q.response || '', q.answer);
    }
    T.ms = Date.now() - T.started;
    saveScore();
    drawResults();
    window.scrollTo(0, 0);
  }
  const score = () => T.qs.filter(q => q.correct || q.override).length;
  function saveScore() {
    const sc = score();
    changeSet(view.setId, (st) => { st.lastTest = { score: sc, total: T.qs.length, at: Date.now() }; st.studied = Date.now(); }, { quiet: true, delay: 600 });
  }
  function line(k, v, cls) {
    return h('div', { class: 'rv-line' }, h('span', { class: 'k', text: k }), h('span', { class: 'v' + (cls ? ' ' + cls : ''), text: v }));
  }
  function reviewRow(q, i) {
    const ok = q.correct || q.override;
    const lines = [];
    if (q.type === 'tf') {
      lines.push(line(q.aWord === 'term' ? 'Term shown' : 'Definition shown', q.shown));
      lines.push(line('Your answer', q.response == null ? 'No answer' : (q.response ? 'True' : 'False'), ok ? 'good' : 'bad'));
      if (!ok) lines.push(line('Correct answer', q.truth ? 'True' : 'False'));
      if (!q.truth) lines.push(line(`Matching ${q.aWord}`, q.answer, 'good'));
    } else {
      const given = q.type === 'mc' ? (q.response == null ? '' : q.options[q.response]) : String(q.response || '').trim();
      lines.push(line('Your answer', given || 'No answer', ok ? 'good' : 'bad'));
      if (!ok || (q.type === 'written' && norm(given) !== norm(q.answer))) lines.push(line('Correct answer', q.answer, 'good'));
      if (q.type === 'written' && !q.correct && given) {
        lines.push(h('button', { class: 'btn btn-ghost btn-sm rv-fix', type: 'button', onclick: () => { q.override = !q.override; saveScore(); drawResults(); } },
          q.override ? 'Undo: count it wrong' : 'I was right'));
      }
    }
    return h('div', { class: 'rv ' + (ok ? 'rv-ok' : 'rv-no') },
      h('div', { class: 'rv-mark', 'aria-label': ok ? 'Correct' : 'Wrong', role: 'img' }, icon(ok ? 'check' : 'x', 18)),
      h('div', { class: 'rv-main' },
        h('div', { class: 'rv-top' }, h('span', { class: 'qnum', text: String(i + 1) }), h('span', { class: 'eyebrow', text: TYPE_NAMES[q.type] })),
        h('div', { class: 'rv-prompt', text: q.prompt }),
        ...lines));
  }
  function drawResults() {
    const sc = score(), total = T.qs.length;
    const pct = Math.round((sc / total) * 100);
    const missed = T.qs.filter(q => !(q.correct || q.override));
    const msg = pct >= 90 ? 'Excellent work.' : pct >= 75 ? 'Good job. Review the ones you missed.' : pct >= 50 ? 'Getting there. Study the misses, then try again.' : 'Keep at it. Flashcards and Learn will help.';
    const starBtn = missed.length ? h('button', { class: 'btn', type: 'button', onclick: () => {
      changeSet(view.setId, (st) => { for (const q of missed) if (!st.stars.includes(q.cid)) st.stars.push(q.cid); }, { quiet: true, delay: 400 });
      starBtn.disabled = true;
      starBtn.replaceChildren(icon('check', 16), 'Starred');
      toast(`Starred ${plural(missed.length, 'term')}. Study them with “Starred terms only.”`);
    } }, icon('star', 16), `Star missed terms (${missed.length})`) : null;
    body.replaceChildren(
      h('section', { class: 'score-card enter-fade' },
        h('div', { class: 'score-ring', style: `--p:${pct}`, role: 'img', 'aria-label': `${pct} percent` }, h('b', { text: pct + '%' })),
        h('div', { class: 'score-text' },
          h('h1', { class: 'res-title', text: `${sc} of ${total} correct` }),
          h('p', { class: 'muted', text: `${msg} Time: ${fmtClock(T.ms)}.` }),
          h('div', { class: 'res-actions' }, starBtn, h('button', { class: 'btn btn-primary', type: 'button', onclick: () => { drawSetup(); window.scrollTo(0, 0); } }, 'New test')))),
      h('section', { class: 'review' }, h('h2', { class: 'h2', text: 'Review' }), ...T.qs.map(reviewRow)));
  }

  root.append(studyHeader(s0, 'test'), body);
  drawSetup();
  return root;
};

/* ================= match ================= */
function pickPairs(set, n) {
  const out = [], seen = new Set();
  for (const c of shuffle(set.cards.slice())) {
    const a = norm(c.t), b = norm(c.d);
    if (!a || !b || a === b || seen.has(a) || seen.has(b)) continue;
    seen.add(a); seen.add(b);
    out.push(c);
    if (out.length === n) break;
  }
  return out;
}
VIEWS.match = function MatchView() {
  const s0 = getSet(view.setId);
  if (!s0) return missingSet();
  const root = h('div', { class: 'study' });
  const body = h('div');
  let M = null, raf = 0, endTimer = 0;
  view.cleanup = () => { cancelAnimationFrame(raf); clearTimeout(endTimer); if (M) M.done = true; };
  const cur = () => getSet(view.setId);

  function drawReady() {
    cancelAnimationFrame(raf);
    if (M) M.done = true;
    const s = cur();
    if (!s) { show('home'); return; }
    body.replaceChildren(h('section', { class: 'match-ready paper-panel enter-fade' },
      h('h1', { class: 'study-title', text: 'Match' }),
      h('p', { class: 'muted', text: 'Tap a term, then tap its definition. Clear the board as fast as you can. A wrong match adds 1 second.' }),
      s.matchBest ? h('p', { class: 'best' }, icon('clock', 16), `Your best: ${secs(s.matchBest)} seconds`) : null,
      h('button', { class: 'btn btn-primary', type: 'button', id: 'match-start', onclick: startGame }, 'Start game')));
  }
  const elapsed = () => (performance.now() - M.start) / 1000 + M.penalty;
  function startGame() {
    const s = cur();
    if (!s) { show('home'); return; }
    const pairs = pickPairs(s, 6);
    if (pairs.length < 2) { toast('Match needs at least 2 cards with different terms and definitions.'); return; }
    const tiles = shuffle(pairs.flatMap(c => [{ cid: c.id, side: 't', text: c.t }, { cid: c.id, side: 'd', text: c.d }]));
    const timerEl = h('span', { class: 'timer', text: '0.0' });
    const penEl = h('span', { class: 'penalty', 'aria-hidden': 'true', text: '+1 sec' });
    const grid = h('div', { class: 'match-grid' });
    M = { tiles, left: pairs.length, sel: null, penalty: 0, start: performance.now(), done: false, penEl };
    tiles.forEach((t, i) => {
      t.el = h('button', { class: 'mt ' + tileSize(t.text), type: 'button', onclick: () => tap(i) }, h('span', { text: t.text }));
      grid.append(t.el);
    });
    body.replaceChildren(
      h('div', { class: 'match-top' },
        h('div', { class: 'timer-wrap' }, icon('clock', 20), timerEl, penEl),
        h('button', { class: 'btn btn-ghost btn-sm', type: 'button', onclick: drawReady }, 'Quit')),
      grid);
    const loop = () => {
      if (!M || M.done) return;
      timerEl.textContent = elapsed().toFixed(1);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
  }
  function tap(i) {
    if (!M || M.done) return;
    const t = M.tiles[i];
    if (t.gone) return;
    if (M.sel === i) { t.el.classList.remove('sel'); M.sel = null; return; }
    if (M.sel == null) { M.sel = i; t.el.classList.add('sel'); return; }
    const a = M.tiles[M.sel];
    M.sel = null;
    a.el.classList.remove('sel');
    if (a.cid === t.cid && a.side !== t.side) {
      a.gone = t.gone = true;
      a.el.classList.add('ok');
      t.el.classList.add('ok');
      const ae = a.el, te = t.el;
      setTimeout(() => { ae.classList.add('gone'); te.classList.add('gone'); }, 160);
      M.left--;
      if (M.left === 0) finish();
    } else {
      M.penalty += 1;
      const ae = a.el, te = t.el;
      ae.classList.remove('wrong'); te.classList.remove('wrong');
      void ae.offsetWidth;
      ae.classList.add('wrong'); te.classList.add('wrong');
      setTimeout(() => { ae.classList.remove('wrong'); te.classList.remove('wrong'); }, 380);
      M.penEl.classList.add('show');
      clearTimeout(M.penTimer);
      M.penTimer = setTimeout(() => M.penEl.classList.remove('show'), 800);
    }
  }
  function finish() {
    M.done = true;
    cancelAnimationFrame(raf);
    const total = elapsed();
    const ms = Math.round(total * 1000);
    const s = cur();
    if (!s) return;
    const prevBest = s.matchBest;
    const isBest = !prevBest || ms < prevBest;
    changeSet(s.id, (st) => { if (isBest) st.matchBest = ms; st.studied = Date.now(); }, { quiet: true, delay: 400 });
    const penalty = M.penalty;
    endTimer = setTimeout(() => {
      body.replaceChildren(h('section', { class: 'match-ready paper-panel enter-fade' },
        h('p', { class: 'eyebrow', text: isBest ? (prevBest ? 'New best time' : 'Your first finish') : 'Finished' }),
        h('div', { class: 'big-time' }, total.toFixed(1), h('small', { text: ' seconds' })),
        h('p', { class: 'muted', text: isBest
          ? (prevBest ? `You beat your old best of ${secs(prevBest)} seconds.` : 'That is the time to beat.')
          : `Your best is ${secs(prevBest)} seconds.` }),
        penalty ? h('p', { class: 'muted small', text: `Includes ${plural(penalty, 'second')} added for wrong matches.` }) : null,
        h('div', { class: 'res-actions' },
          h('button', { class: 'btn btn-primary', type: 'button', id: 'match-again', onclick: startGame }, 'Play again'),
          h('button', { class: 'btn', type: 'button', onclick: () => show('set', { setId: view.setId }) }, 'Back to set'))));
      const again = document.getElementById('match-again');
      if (again) again.focus({ preventScroll: true });
    }, 450);
  }

  root.append(studyHeader(s0, 'match'), body);
  drawReady();
  return root;
};

/* ================= boot ================= */
buildTopbar();
renderView();
updateSync();
connect();
sampleReady.then(() => { if (view.name === 'edit' && view.onSample) view.onSample(); });
})();
</script>
